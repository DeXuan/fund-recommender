<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1677ff"/>
      <stop offset="100%" style="stop-color:#0958d9"/>
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <!-- Stock chart icon - upward trend line -->
  <polyline points="180,650 320,500 460,580 600,350 740,280 860,200"
    fill="none" stroke="white" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Candlestick bars -->
  <rect x="260" y="420" width="50" height="200" rx="8" fill="white" opacity="0.7"/>
  <rect x="400" y="480" width="50" height="180" rx="8" fill="white" opacity="0.7"/>
  <rect x="540" y="300" width="50" height="220" rx="8" fill="white" opacity="0.7"/>
  <rect x="680" y="220" width="50" height="200" rx="8" fill="white" opacity="0.7"/>
  <!-- Arrow tip -->
  <polygon points="830,180 870,200 830,230" fill="white" opacity="0.9"/>
  <!-- ¥ symbol -->
  <text x="512" y="850" font-family="Arial, sans-serif" font-size="160" font-weight="bold" fill="white" text-anchor="middle" opacity="0.95">¥</text>
</svg>
